<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Otolorin — Portfolio Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d1117;
            --text: #e6edf3;
            --green: #3fb950;
            --blue: #58a6ff;
            --yellow: #e3b341;
            --red: #f85149;
            --purple: #a371f7;
            --cyan: #39c5cf;
            --gray: #8b949e;
            --dark: #161b22;
            --border: #30363d;
            --mono: 'Courier New', 'Monaco', 'Menlo', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* CRT scanline */
        body::before {
            content: '';
            display: block;
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* ── HINT BAR (top) ── */
        .hint-bar {
            background: #0a0f14;
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            font-size: 12px;
            color: var(--gray);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }
        .hint-bar span { color: var(--cyan); }
        .hint-bar strong { color: var(--yellow); margin-right: 4px; }

        /* ── QUICK NAV ── */
        .quick-nav {
            background: var(--dark);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--cyan);
            font-family: var(--mono);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: rgba(63,185,80,0.08);
        }

        /* ── TERMINAL ── */
        .terminal-wrap {
            max-width: 900px;
            margin: 24px auto;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .terminal-header {
            background: var(--dark);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            user-select: none;
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-r { background: #f85149; }
        .dot-y { background: #e3b341; }
        .dot-g { background: #3fb950; }
        .terminal-header-title {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: var(--gray);
        }

        .terminal-body {
            padding: 20px;
            min-height: 500px;
            max-height: 75vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: var(--bg); }
        .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── OUTPUT ── */
        .line { margin: 3px 0; white-space: pre-wrap; word-break: break-word; }
        .g { color: var(--green); }
        .b { color: var(--blue); }
        .y { color: var(--yellow); }
        .r { color: var(--red); }
        .p { color: var(--purple); }
        .c { color: var(--cyan); }
        .gr { color: var(--gray); }
        .bold { font-weight: bold; }

        /* ── INPUT LINE ── */
        .input-row {
            display: flex;
            align-items: center;
            margin-top: 10px;
            padding-top: 6px;
            border-top: 1px solid #1c2128;
        }
        .prompt-label { color: var(--green); white-space: nowrap; flex-shrink: 0; }
        .prompt-user { color: var(--blue); }
        .prompt-host { color: var(--cyan); }
        .cmd-input {
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            flex: 1;
            outline: none;
            margin-left: 6px;
            caret-color: var(--green);
        }
        .blink-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--green);
            animation: blink 1s step-start infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* ── SECTION BLOCKS ── */
        .section-header {
            color: var(--green);
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin: 12px 0 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .skill-row { margin: 5px 0; display: flex; align-items: center; gap: 10px; }
        .skill-label { color: var(--cyan); min-width: 200px; }
        .skill-bar-bg { background: var(--dark); width: 180px; height: 10px; display: inline-block; border: 1px solid var(--border); }
        .skill-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); }

        .project-block {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            margin: 10px 0;
            background: var(--dark);
            transition: border-color 0.2s;
        }
        .project-block:hover { border-color: var(--green); }
        .project-name { color: var(--green); font-weight: bold; font-size: 15px; }
        .project-desc { color: var(--text); margin: 6px 0; }
        .project-tech { color: var(--purple); font-size: 12px; margin-top: 6px; }
        .project-link { color: var(--cyan); font-size: 12px; text-decoration: none; }
        .project-link:hover { color: var(--green); }
        .badge {
            display: inline-block;
            background: rgba(63,185,80,0.12);
            border: 1px solid var(--green);
            color: var(--green);
            font-size: 10px;
            padding: 1px 7px;
            border-radius: 20px;
            margin-left: 8px;
        }
        .badge-wip {
            background: rgba(227,179,65,0.12);
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .timeline-line { border-left: 2px solid var(--border); padding-left: 18px; margin-left: 8px; }
        .tl-item { position: relative; margin: 14px 0; }
        .tl-item::before { content: '◆'; position: absolute; left: -24px; color: var(--green); font-size: 10px; top: 4px; }
        .tl-date { color: var(--gray); font-size: 12px; }
        .tl-title { color: var(--blue); font-weight: bold; }
        .tl-role { color: var(--cyan); }

        .contact-row { margin: 5px 0; }
        .contact-row a { color: var(--cyan); text-decoration: none; }
        .contact-row a:hover { color: var(--green); text-decoration: underline; }

        .ascii { color: var(--green); font-size: 11px; line-height: 1.15; }
        .divider { border-top: 1px solid var(--border); margin: 8px 0; }

        @media (max-width: 640px) {
            .terminal-wrap { margin: 0; border-radius: 0; height: 100vh; }
            .terminal-body { max-height: calc(100vh - 160px); }
            .skill-bar-bg { width: 100px; }
            .skill-label { min-width: 150px; }
        }
    </style>
</head>

// ── RUN COMMAND ───────────────────────────────────────────────────────
function runCmd(raw) {
    const cmd = raw.trim().toLowerCase();
    if (!cmd) return;

    echoCommand(raw.trim());

    if (history[0] !== raw.trim()) history.unshift(raw.trim());
    histIdx = -1;

    if (commands[cmd]) {
        commands[cmd]();
    } else if (cmd === 'sudo') {
        appendLine('<span class="r">Permission denied. Nice try though 😄</span>');
    } else if (cmd === 'exit' || cmd === 'quit') {
        appendLine('<span class="gr">Session ended. Come back anytime!</span>');
    } else {
        appendLine(`<span class="r">Command not found: ${raw.trim()}</span> <span class="gr">— Type <span class="y">help</span> for available commands.</span>`);
    }

    appendLine('');
    scrollDown();
}

// ── INPUT HANDLING ────────────────────────────────────────────────────
input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        runCmd(input.value);
        input.value = '';
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
        else { histIdx = -1; input.value = ''; }
    }
});

// Clicking terminal focuses input
document.getElementById('termBody').addEventListener('click', () => input.focus());

// Quick nav buttons
function runCmd(cmd) {
    input.value = '';
    const raw = cmd;
    const key = raw.trim().toLowerCase();
    echoCommand(raw.trim());
    if (history[0] !== raw.trim()) history.unshift(raw.trim());
    histIdx = -1;
    if (commands[key]) {
        commands[key]();
    } else if (key === 'sudo') {
        appendLine('<span class="r">Permission denied. Nice try 😄</span>');
    } else {
        appendLine(`<span class="r">Command not found: ${raw}</span> <span class="gr">— Type <span class="y">help</span> for available commands.</span>`);
    }
    appendLine('');
    scrollDown();
}
</script>
